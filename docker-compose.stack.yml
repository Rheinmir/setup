# overstack-mcp như MỘT stack riêng — devops-agent (hostops) ưu tiên tên file này khi stack_deploy:
#   stack_sync  overstack-mcp  https://github.com/Rheinmir/setup  <ref>      → /home/rhein/stacks/overstack-mcp
#   stack_deploy overstack-mcp                                             → docker compose up -d --build
# Không publish ra 0.0.0.0: chỉ loopback của host (hoặc tailnet qua OVERSTACK_MCP_BIND) và network ai-net
# (alias `overstack-mcp` để devops-agent / PM agent gọi http://overstack-mcp:8791/mcp). .env do operator viết trên host.
name: overstack-mcp

services:
  overstack-mcp:
    build:
      context: .
      dockerfile: Dockerfile.mcp
      args:
        ORCA_GRAPH_REF: ${ORCA_GRAPH_REF:-main}
        SKILLS_REF: ${SKILLS_REF:-main}
    image: overstack-mcp:latest
    container_name: overstack-mcp
    restart: unless-stopped
    # .env do operator viết trên host; smoke cục bộ truyền --env-file nên file có thể vắng
    env_file:
      - path: .env
        required: false
    environment:
      # vắng → server sinh token lần đầu vào volume (/workspaces/.overstack-mcp-token); đọc: docker exec overstack-mcp cat /workspaces/.overstack-mcp-token
      OVERSTACK_MCP_TOKEN: ${OVERSTACK_MCP_TOKEN:-}
      OVERSTACK_TOOLS: ${OVERSTACK_TOOLS:-core}
      OVERSTACK_GIT_ALLOW: ${OVERSTACK_GIT_ALLOW:-https://github.com/Rheinmir/}
      OVERSTACK_GIT_TOKEN: ${OVERSTACK_GIT_TOKEN:-}
      OVERSTACK_TOOL_TIMEOUT_MS: ${OVERSTACK_TOOL_TIMEOUT_MS:-120000}
    ports:
      - "${OVERSTACK_MCP_BIND:-127.0.0.1}:8791:8791"
    volumes:
      - workspaces:/workspaces
    networks:
      default:
      ai-net:
        aliases: [overstack-mcp]
    read_only: true
    tmpfs:
      - /tmp
      - /home/app
    security_opt:
      - no-new-privileges:true
    cap_drop: [ALL]
    mem_limit: 1g
    cpus: 2
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8791/healthz"]
      interval: 30s
      timeout: 5s
      retries: 3

  # Cloudflare Tunnel (profile `tunnel`): public hostname skills.giatbh.io.vn → http://overstack-mcp:8791 (cấu hình trên dashboard
  # Zero Trust). TUNNEL_TOKEN lấy từ Vault k8s2 secret/infra/cloudflare, viết vào .env của stack. Chỉ bật cùng OVERSTACK_TOOLS=read
  # — hostname công khai KHÔNG được có tool_run/workspace_sync/orca_graph.
  cloudflared:
    image: cloudflare/cloudflared:latest
    container_name: overstack-mcp-cloudflared
    restart: unless-stopped
    command: ["tunnel", "--no-autoupdate", "run"]
    environment:
      TUNNEL_TOKEN: ${TUNNEL_TOKEN:-}
    depends_on:
      overstack-mcp:
        condition: service_healthy
    networks:
      default:
      ai-net:
    profiles: ["tunnel"]

  # Phát hành bản ĐỌC lên Cloudflare Workers (profile `worker`, chạy một lần rồi thoát): cùng ảnh overstack-mcp (đã có node,
  # skill clone, catalog), gom assets → wrangler deploy --domain → (secret bearer) → curl /healthz. Biến dưới do hostops bơm cho
  # đúng một lần `compose up` từ két của devops-agent (stack_deploy creds: deploy-cloudflare-api-token bắt buộc; account id tự suy;
  # deploy-overstack-mcp-token tuỳ chọn) — không nằm trong .env. Gọi: stack_deploy {stack:"overstack-mcp", services:["worker-deploy"], creds:[…]}
  # hoặc flow `worker_release` của devops-agent. Chạy tay: CLOUDFLARE_API_TOKEN=… CLOUDFLARE_ACCOUNT_ID=… docker compose … up worker-deploy
  worker-deploy:
    image: overstack-mcp:latest
    build:
      context: .
      dockerfile: Dockerfile.mcp
      args:
        ORCA_GRAPH_REF: ${ORCA_GRAPH_REF:-main}
        SKILLS_REF: ${SKILLS_REF:-main}
    container_name: overstack-mcp-worker-deploy
    restart: "no"
    command: ["bash", "scripts/worker-deploy.sh"]
    environment:
      CLOUDFLARE_API_TOKEN: ${CLOUDFLARE_API_TOKEN:-}
      CLOUDFLARE_ACCOUNT_ID: ${CLOUDFLARE_ACCOUNT_ID:-}
      OVERSTACK_MCP_TOKEN: ${OVERSTACK_MCP_TOKEN:-}
      OVERSTACK_WORKER_DOMAIN: ${OVERSTACK_WORKER_DOMAIN-skills.giatbh.io.vn}
      WRANGLER_SEND_METRICS: "false"
      CI: "1"
      HOME: /tmp
      npm_config_cache: /tmp/npm
    tmpfs:
      - /tmp:exec   # npx cài wrangler vào /tmp — esbuild/workerd postinstall cần chạy binary; tmpfs mặc định noexec
    security_opt:
      - no-new-privileges:true
    cap_drop: [ALL]
    mem_limit: 1g
    cpus: 2
    profiles: ["worker"]

networks:
  ai-net:
    external: true

volumes:
  workspaces:
